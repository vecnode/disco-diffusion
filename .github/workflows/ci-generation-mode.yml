name: Generation mode (CLI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parse-generation-mode:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ["None", "2D"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal dependency for CLI
        run: pip install requests
      - name: Verify --generation-mode ${{ matrix.mode }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          MODE: ${{ matrix.mode }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, os.environ["PYTHONPATH"])
          from discodiff.cli.parser import parse_disco_argv
          mode = os.environ["MODE"]
          argv = [
              "--generation-mode", mode,
              "--steps", "2",
              "--width", "64",
              "--height", "64",
          ]
          d = parse_disco_argv(argv)
          assert d.get("GENERATION_MODE") == mode, d
          print("ok", d)
          PY
